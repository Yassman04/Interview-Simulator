<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Simulator | Live Room</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .main-content {
            display: flex;
            gap: 20px;
        }
        /* The Camera Window */
        .video-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        video {
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            background-color: #2c3e50;
            border: 3px solid #bdc3c7;
        }
        /* The Chat Window */
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-box {
            flex-grow: 1;
            background-color: #ecf0f1;
            border-radius: 8px;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            margin-bottom: 15px;
            border: 1px solid #bdc3c7;
        }
        .chat-box p {
            margin: 0 0 10px 0;
            line-height: 1.4;
        }
        /* The Microphone Button */
        .record-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%;
        }
        .record-btn:active {
            background-color: #c0392b;
        }
        .record-btn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .finish-btn {
            background-color: #95a5a6;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            text-decoration: none;
            text-align: center;
            display: inline-block;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Interviewing for: {{ job_role }}</h2>
        </div>

        <div class="main-content">
            <div class="video-section">
                <video id="webcam" autoplay playsinline muted></video>
            </div>

            <div class="chat-section">
                <div class="chat-box" id="chat-window">
                    <p><strong>System:</strong> Initializing interview. Please wait...</p>
                </div>
                
                <button class="record-btn" id="record-btn">Click to Speak</button>
                <a href="/feedback" class="finish-btn">Finish Interview</a>
            </div>
        </div>
    </div>

    <script>
        // --- CAMERA LOGIC ---
        const videoElement = document.getElementById('webcam');

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(stream) {
                videoElement.srcObject = stream;
            })
            .catch(function(error) {
                console.error("Camera access denied:", error);
                alert("Please allow camera access for the interview simulator.");
            });


        // --- MICROPHONE LOGIC ---
        const recordBtn = document.getElementById('record-btn');
        let isRecording = false;
        let mediaRecorder;
        let audioChunks = [];

        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                // START RECORDING
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) {
                            audioChunks.push(event.data);
                        }
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        
                        recordBtn.textContent = "Processing Answer...";
                        recordBtn.style.backgroundColor = "#f39c12"; 
                        recordBtn.disabled = true;

                        const formData = new FormData();
                        formData.append('audio', audioBlob, 'answer.webm');

                        // Throw the package to our Python server
                        fetch('/process_audio', {
                            method: 'POST',
                            body: formData
                        })
                        .then(response => response.json())
                        .then(data => {
                            console.log("Server says:", data);
                            
                            // Add the transcript to the chat window
                            if (data.transcript) {
                                const chatBox = document.getElementById('chat-window');
                                const userMessage = document.createElement('p');
                                userMessage.innerHTML = `<strong>You:</strong> ${data.transcript}`;
                                chatBox.appendChild(userMessage);
                                
                                // Automatically scroll to the bottom of the chat
                                chatBox.scrollTop = chatBox.scrollHeight;
                            }
                            
                            // Reset the button for the next question
                            recordBtn.textContent = "Click to Speak";
                            recordBtn.style.backgroundColor = "#e74c3c"; 
                            recordBtn.disabled = false;
                        })
                        .catch(error => {
                            console.error("Error sending audio:", error);
                            recordBtn.textContent = "Error. Try Again.";
                            recordBtn.disabled = false;
                        });

                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    
                    recordBtn.textContent = "Recording... (Click to Stop)";
                    recordBtn.style.backgroundColor = "#c0392b"; 

                } catch (err) {
                    console.error("Microphone access denied:", err);
                    alert("Please allow microphone access to answer questions.");
                }
            } else {
                // STOP RECORDING
                mediaRecorder.stop();
                isRecording = false;
            }
        });
    </script>

</body>
</html>
