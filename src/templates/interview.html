<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Simulator | Live Room</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
            position: relative; 
        }
        
        /* --- NEW: Settings Button & Dropdown Menu Styles --- */
        .settings-btn {
            position: absolute;
            top: 0;
            right: 0;
            background-color: #34495e; 
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .settings-btn:hover {
            background-color: #2c3e50;
        }
        .settings-menu {
            display: none; /* Hidden by default */
            position: absolute;
            top: 40px;
            right: 0;
            background-color: white;
            border: 1px solid #bdc3c7;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 100;
            text-align: left;
            width: 260px;
        }
        .settings-menu.show {
            display: block; /* Class to toggle visibility */
        }
        .settings-menu h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 16px;
            color: #2c3e50;
            border-bottom: 1px solid #ecf0f1;
            padding-bottom: 5px;
        }
        .setting-group {
            margin-bottom: 15px;
        }
        .setting-group h4 {
            margin: 0 0 5px 0;
            font-size: 14px;
            color: #7f8c8d;
        }
        .setting-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            cursor: pointer;
        }
        .audio-toggle {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            width: 100%;
        }

        .main-content {
            display: flex;
            gap: 20px;
        }
        .video-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        video {
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            background-color: #2c3e50;
            border: 3px solid #bdc3c7;
        }
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-box {
            flex-grow: 1;
            background-color: #ecf0f1;
            border-radius: 8px;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            margin-bottom: 15px;
            border: 1px solid #bdc3c7;
        }
        .chat-box p {
            margin: 0 0 15px 0;
            line-height: 1.4;
        }
        .interviewer-msg {
            color: #2980b9;
        }
        .user-msg {
            color: #27ae60;
        }
        .record-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%;
        }
        .record-btn:active {
            background-color: #c0392b;
        }
        .record-btn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .finish-btn {
            background-color: #95a5a6;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            text-decoration: none;
            text-align: center;
            display: inline-block;
            box-sizing: border-box;
        }
        .play-audio-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 5px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <button id="settings-btn" class="settings-btn">⚙️ Voice Settings</button>
            
            <div id="settings-menu" class="settings-menu">
                <h3>Audio Preferences</h3>
                
                <div class="setting-group">
                    <button id="audio-toggle" class="audio-toggle">🔊 Voice is ON</button>
                </div>

                <div class="setting-group">
                    <h4>Female Voices</h4>
                    <label><input type="radio" name="voice_select" value="aura-asteria-en" checked> Asteria (US English)</label>
                    <label><input type="radio" name="voice_select" value="aura-luna-en"> Luna (US English)</label>
                    <label><input type="radio" name="voice_select" value="aura-athena-en"> Athena (US English)</label>
                </div>

                <div class="setting-group">
                    <h4>Male Voices</h4>
                    <label><input type="radio" name="voice_select" value="aura-arcas-en"> Arcas (US English)</label>
                    <label><input type="radio" name="voice_select" value="aura-perseus-en"> Perseus (US English)</label>
                    <label><input type="radio" name="voice_select" value="aura-orpheus-en"> Orpheus (US English)</label>
                    <label><input type="radio" name="voice_select" value="aura-zeus-en"> Zeus (US English)</label>
                    <label><input type="radio" name="voice_select" value="aura-helios-en"> Helios (UK English)</label>
                    <label><input type="radio" name="voice_select" value="aura-angus-en"> Angus (Irish English)</label>
                </div>
            </div>

            <h2>Interviewing for: {{ job_role }}</h2>
        </div>

        <div class="main-content">
            <div class="video-section">
                <video id="webcam" autoplay playsinline muted></video>
            </div>

            <div class="chat-section">
                <div class="chat-box" id="chat-window">
                    <p class="interviewer-msg">
                        <strong>Interviewer:</strong> <span id="current-question">{{ first_question }}</span>
                    </p>
                    <button class="play-audio-btn" onclick="playFirstQuestion()">
                        🔊 Listen to Question
                    </button>
                </div>
                
                <button class="record-btn" id="record-btn">Click to Speak</button>
                <a href="/feedback" class="finish-btn" id="finish-btn">Finish Interview</a>
            </div>
        </div>
    </div>

    <script>
        // Settings Menu Logic
        const settingsBtn = document.getElementById('settings-btn');
        const settingsMenu = document.getElementById('settings-menu');
        
        // Open/Close the menu
        settingsBtn.addEventListener('click', () => {
            settingsMenu.classList.toggle('show');
        });

        // Hide menu if user clicks anywhere outside of it
        document.addEventListener('click', (event) => {
            if (!settingsBtn.contains(event.target) && !settingsMenu.contains(event.target)) {
                settingsMenu.classList.remove('show');
            }
        });

        // Track the current voice choice (Defaults to Asteria)
        let selectedVoiceModel = "aura-asteria-en";
        const voiceRadios = document.querySelectorAll('input[name="voice_select"]');
        
        voiceRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                selectedVoiceModel = e.target.value;
            });
        });

        // --- Voice Toggle Logic ---
        let currentAudio = null;
        let isVoiceEnabled = true;
        const voiceToggleBtn = document.getElementById('audio-toggle');

        voiceToggleBtn.addEventListener('click', () => {
            isVoiceEnabled = !isVoiceEnabled;
            
            if (isVoiceEnabled) {
                voiceToggleBtn.textContent = "🔊 Voice is ON";
                voiceToggleBtn.style.backgroundColor = "#27ae60"; 
            } else {
                voiceToggleBtn.textContent = "🔇 Voice is OFF";
                voiceToggleBtn.style.backgroundColor = "#95a5a6"; 
                
                if (currentAudio) {
                    currentAudio.pause();
                }
            }
        });

        // --- Dynamic Audio Fetching ---
        async function playFirstQuestion() {
            if (!isVoiceEnabled) return; 
            
            // Grab the exact text of the question currently on the screen
            const questionText = document.getElementById('current-question').innerText;
            const playBtn = document.querySelector('.play-audio-btn');
            
            // Show a loading state so the user knows it is working
            playBtn.textContent = "⏳ Loading Voice...";
            playBtn.disabled = true;

            try {
                // Ask Python to generate the audio with the new selected voice
                const response = await fetch('/get_audio', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: questionText,
                        voice_model: selectedVoiceModel
                    })
                });

                const data = await response.json();

                // Play the new audio
                if (data.audio_base64) {
                    if (currentAudio) currentAudio.pause();
                    currentAudio = new Audio("data:audio/mp3;base64," + data.audio_base64);
                    currentAudio.play();
                }
            } catch (error) {
                console.error("Audio error:", error);
            }

            // Reset the button text
            playBtn.textContent = "🔊 Listen to Question";
            playBtn.disabled = false;
        }

        // --- CAMERA LOGIC ---
        const videoElement = document.getElementById('webcam');
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(stream) {
                videoElement.srcObject = stream;
            })
            .catch(function(error) {
                console.error("Camera access denied:", error);
            });

        // --- MICROPHONE & INTERVIEW LOGIC ---
        const recordBtn = document.getElementById('record-btn');
        let isRecording = false;
        let mediaRecorder;
        let audioChunks = [];

        recordBtn.addEventListener('click', async () => {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) {
                            audioChunks.push(event.data);
                        }
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        
                        recordBtn.textContent = "Grading Answer...";
                        recordBtn.style.backgroundColor = "#f39c12"; 
                        recordBtn.disabled = true;

                        const formData = new FormData();
                        formData.append('audio', audioBlob, 'answer.webm');
                        
                        // --- NEW: Attach the selected voice to the package! ---
                        formData.append('voice_model', selectedVoiceModel);

                        fetch('/process_audio', {
                            method: 'POST',
                            body: formData
                        })
                        .then(response => response.json())
                        .then(data => {
                            const chatBox = document.getElementById('chat-window');
                            
                            if (data.transcript) {
                                const userMessage = document.createElement('p');
                                userMessage.className = "user-msg";
                                userMessage.innerHTML = `<strong>You:</strong> ${data.transcript}`;
                                chatBox.appendChild(userMessage);
                            }
                            
                            if (data.next_question) {
                                const aiMessage = document.createElement('p');
                                aiMessage.className = "interviewer-msg";
                                aiMessage.innerHTML = `<strong>Interviewer:</strong> ${data.next_question}`;
                                chatBox.appendChild(aiMessage);
                                
                                if (data.audio_base64 && isVoiceEnabled) {
                                    if (currentAudio) currentAudio.pause();
                                    currentAudio = new Audio("data:audio/mp3;base64," + data.audio_base64);
                                    currentAudio.play();
                                }
                            }

                            chatBox.scrollTop = chatBox.scrollHeight;
                            
                            if (data.is_finished) {
                                recordBtn.textContent = "Interview Complete";
                                recordBtn.style.backgroundColor = "#27ae60"; 
                            } else {
                                recordBtn.textContent = "Click to Speak";
                                recordBtn.style.backgroundColor = "#e74c3c"; 
                                recordBtn.disabled = false;
                            }
                        })
                        .catch(error => {
                            console.error("Error sending audio:", error);
                            recordBtn.textContent = "Error. Try Again.";
                            recordBtn.disabled = false;
                        });

                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    
                    recordBtn.textContent = "Recording... (Click to Stop)";
                    recordBtn.style.backgroundColor = "#c0392b"; 

                } catch (err) {
                    console.error("Microphone access denied:", err);
                    alert("Please allow microphone access to answer questions.");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
            }
        });
    // --- NEW: Loading State for the Finish Button ---
        const finishBtn = document.getElementById('finish-btn');
        finishBtn.addEventListener('click', function() {
            this.textContent = "Generating Feedback... ";
            this.style.backgroundColor = "#f39c12"; 
            this.style.pointerEvents = "none"; 
        });
    </script>

</body>
</html>
