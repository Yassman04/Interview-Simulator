<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Interview Simulator | Feedback</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <button id="themeToggle" class="theme-btn">🌙 Dark Mode</button>

    <div class="container">
        <div class="header">
            <h2>Interview Complete</h2>
            <p>Here is your performance evaluation for the <strong>{{ job_role }}</strong> position.</p>
        </div>

        <div class="evaluation-content">
            {{ evaluation | safe }}
        </div>

        <a href="/" class="btn-link">Start New Interview</a>
    </div>

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
