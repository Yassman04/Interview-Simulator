<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Interview Simulator | Setup</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="top-right-controls">
        <button id="themeToggle" class="theme-btn">🌙 Dark Mode</button>
    </div>

    <div class="container">
        <h1> Interview Simulator</h1>

        <form action="/" method="POST">
            <div class="input-group">
                <label for="job_role">Target Job Role</label>
                <input type="text" id="job_role" name="job_role" placeholder="Can be as specific as you want e.g, Band 5 Dietitian for the NHS" required>
            </div>

            <div class="input-group">
                <label for="num_questions">Number of Questions</label>
                <input type="number" id="num_questions" name="num_questions" min="1" max="10" value="5" required>
            </div>

            <button type="submit">Start Interview</button>
        </form>
    </div>

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
